<div class="sidebar">
  <div class="sidebar-header">
    <h3>HealthTracker</h3>
    <p>Welcome, {{ user?.firstName }}</p>
  </div>

  <nav class="sidebar-nav">
    <ul>
      <li>
        <a routerLink="/home" routerLinkActive="active">
          <i class="fas fa-tachometer-alt"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/fitness" routerLinkActive="active">
          <i class="fas fa-dumbbell"></i>
          <span>Fitness Tracking</span>
        </a>
      </li>
      <li>
        <a routerLink="/mood" routerLinkActive="active">
          <i class="fas fa-smile"></i>
          <span>Mood Monitoring</span>
        </a>
      </li>
      <li>
        <a routerLink="/journal" routerLinkActive="active">
          <i class="fas fa-book"></i>
          <span>Health Journal</span>
        </a>
      </li>
      <li>
        <a routerLink="/medication" routerLinkActive="active">
          <i class="fas fa-pills"></i>
          <span>Medication</span>
        </a>
      </li>
      <li>
        <a routerLink="/profile" routerLinkActive="active">
          <i class="fas fa-user"></i>
          <span>Profile</span>
        </a>
      </li>
      
      @if (isAdmin) {
        <li class="admin-section">
          <hr>
          <h4>Admin</h4>
        </li>
        <li>
          <a routerLink="/admin/users" routerLinkActive="active">
            <i class="fas fa-users"></i>
            <span>Manage Users</span>
          </a>
        </li>
        <li>
          <a routerLink="/admin/reports" routerLinkActive="active">
            <i class="fas fa-chart-bar"></i>
            <span>Reports</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </button>
  </div>
</div>
