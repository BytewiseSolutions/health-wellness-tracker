<div class="dashboard-layout">
  <app-sidebar></app-sidebar>
  <app-header></app-header>
  
  <div class="main-content">
    <div class="page-header">
      <h1>Health Journal</h1>
      <p>Record your health observations and daily notes</p>
    </div>

    <div class="content-grid">
      <div class="card full-width">
        <div class="journal-header">
          <h3>New Entry</h3>
          <button class="btn-primary">Save Entry</button>
        </div>
        <textarea 
          placeholder="Write about your health, symptoms, or general wellness today..."
          class="journal-textarea">
        </textarea>
      </div>

      <div class="card">
        <h3>Recent Entries</h3>
        <div class="journal-entries">
          <p class="no-data">No journal entries yet. Start documenting your health journey!</p>
        </div>
      </div>
    </div>
  </div>
</div>
