<div class="dashboard-layout">

  <app-header></app-header>

      <p>Track your mental wellness and emotional patterns</p>
    </div>

    <div class="content-grid">
      <div class="card">
        <h3>How are you feeling today?</h3>
        <div class="mood-selector">
          <div class="mood-option">😊 Great</div>
          <div class="mood-option">🙂 Good</div>
          <div class="mood-option">😐 Okay</div>
          <div class="mood-option">😔 Low</div>
          <div class="mood-option">😢 Sad</div>
        </div>
      </div>

      <div class="card">
        <h3>Recent Entries</h3>
        <div class="mood-history">
          <p class="no-data">No mood entries yet. Start tracking your mood today!</p>

    </div>
  </div>
</div>
