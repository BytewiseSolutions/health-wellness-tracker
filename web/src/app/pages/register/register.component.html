<div class="auth-container">
  <div class="auth-card">
    <h2>Join HealthTracker</h2>
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input 
            type="text" 
            id="firstName" 
            name="firstName"
            [(ngModel)]="firstName" 
            required 
            class="form-control"
            placeholder="First name">
        </div>
        
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input 
            type="text" 
            id="lastName" 
            name="lastName"
            [(ngModel)]="lastName" 
            required 
            class="form-control"
            placeholder="Last name">
        </div>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          [(ngModel)]="email" 
          required 
          class="form-control"
          placeholder="Enter your email">
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          [(ngModel)]="password" 
          required 
          class="form-control"
          placeholder="Create a password">
      </div>
      
      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>
        <input 
          type="tel" 
          id="phoneNumber" 
          name="phoneNumber"
          [(ngModel)]="phoneNumber" 
          class="form-control"
          placeholder="Phone number">
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label for="village">Village</label>
          <input 
            type="text" 
            id="village" 
            name="village"
            [(ngModel)]="village" 
            class="form-control"
            placeholder="Village">
        </div>
        
        <div class="form-group">
          <label for="city">City</label>
          <input 
            type="text" 
            id="city" 
            name="city"
            [(ngModel)]="city" 
            class="form-control"
            placeholder="City">
        </div>
      </div>
      
      <div class="form-group">
        <label for="country">Country</label>
        <input 
          type="text" 
          id="country" 
          name="country"
          [(ngModel)]="country" 
          class="form-control"
          placeholder="Country">
      </div>
      
      <button type="submit" class="btn btn-primary btn-full" [disabled]="!registerForm.form.valid">
        Create Account
      </button>
    </form>
    
    <p class="auth-link">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </div>
</div>
